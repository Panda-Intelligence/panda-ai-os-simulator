[package]
name = "mofei-sim-headless"
version = "0.1.0"
edition = "2021"
description = "Headless screenshot harness for the Mofei simulator (PR5)"

[[bin]]
name = "mofei-sim-headless"
path = "src/main.rs"

[[bin]]
name = "mofei-create-sd-image"
path = "src/bin/create_sd_image.rs"

[dependencies]
tokio = { version = "=1.43", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "time", "signal", "sync"] }
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fatfs = "0.3"
