name: standalone-checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: node scripts/audit-export.mjs
# No deployment, signing keys, production environment or pull_request_target.
# Heavy native/WASM runtime qualification is a separate explicit release gate.
