name: standalone-checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: simulator-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-and-web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      # The loader and input-queue tests compile the real QEMU helper C against glib-2.0.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libglib2.0-dev
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run audit:export
# No deployment, signing keys, production environment or pull_request_target.
# Heavy native/WASM runtime qualification is a separate explicit release gate.
